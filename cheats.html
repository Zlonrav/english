<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Читы разработчика</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
  h1 { color: #ff4444; text-align: center; }
  .card { background: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #444; }
  h3 { margin-top: 0; color: #fff; }
  input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 5px; border: none; box-sizing: border-box; font-size: 16px; }
  input, select { background: #333; color: #fff; border: 1px solid #555; }
  button { background: #ff4444; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:hover { background: #cc0000; }
  .btn-green { background: #28a745; } .btn-green:hover { background: #218838; }
  .btn-grey { background: #555; } .btn-grey:hover { background: #444; }
  .btn-blue { background: #2563eb; } .btn-blue:hover { background: #1d4ed8; }
  p.desc { font-size: 12px; color: #aaa; margin-top: 5px; }
  
  #password-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a1a; z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
  }
</style>
</head>
<body>

<!-- ЭКРАН БЛОКИРОВКИ -->
<div id="password-overlay">
  <h2 style="color: #ff4444; text-align: center; margin-bottom: 20px;">🔒 Доступ только для разработчика</h2>
  <input type="password" id="cheat-password" placeholder="Введите пароль" style="width: 100%; max-width: 300px; text-align: center;">
  <button onclick="checkCheatPassword()" style="width: 100%; max-width: 300px;">Войти</button>
</div>

<!-- СЮДА ЗАГРУЗИТСЯ КОНТЕНТ -->
<div id="main-content" style="display: none;"></div>

<script src="js/parent-config.js"></script>
<script>
  let isContentLoaded = false;

  function checkCheatPassword() {
    const pwd = document.getElementById('cheat-password').value;
    
    // Проверка пароля
    if (btoa(pwd) === PARENT_PASSWORD_B64) {
      document.getElementById('cheat-password').value = '';
      document.getElementById('password-overlay').innerHTML = '<h2 style="color: #28a745;">✅ Доступ разрешен. Загрузка...</h2>';
      
      // Если скрипт уже загружен, просто показываем
      if (isContentLoaded) {
        document.getElementById('password-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        return;
      }

      // Динамически подгружаем защищенный JS-файл
      const script = document.createElement('script');
      
      // ЗАКОДИРОВАННЫЙ ПУТЬ: 'js/chits-content.js'
      script.src = atob('anMvY2hpdHMtY29udGVudC5qcw=='); 
      
      script.onload = () => {
        isContentLoaded = true;
        initChitsUI(); // Отрисовываем интерфейс из JS-файла
        document.getElementById('password-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
      };
      
      script.onerror = () => {
        alert('Ошибка загрузки модуля читов. Убедитесь, что файл js/chits-content.js существует.');
      };
      
      document.body.appendChild(script);
      
    } else {
      alert('Неверный пароль!');
      document.getElementById('cheat-password').value = '';
    }
  }

  // Безопасное добавление обработчика Enter
  const pwdInput = document.getElementById('cheat-password');
  if (pwdInput) {
    pwdInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkCheatPassword();
    });
  }
</script>
</body>
</html>
