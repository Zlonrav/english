<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Перенос прогресса | Англомания</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Дополнительные стили для страницы переноса */
  body { background-color: var(--bg-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .transfer-card {
    width: 100%; max-width: 480px; height: 620px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: var(--glass-shadow);
    padding: 30px 20px; box-sizing: border-box;
  }
  .transfer-textarea {
    width: 100%; height: 200px; padding: 15px;
    background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px; color: #fff; font-family: monospace; font-size: 14px;
    resize: none; outline: none; margin-bottom: 15px; box-sizing: border-box;
  }
  .transfer-textarea:focus { border-color: var(--main-color); box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
  .transfer-content { display: none; flex-direction: column; width: 100%; flex-grow: 1; justify-content: center; }
  .transfer-content.active { display: flex; }
</style>
</head>
<body>

<div class="transfer-card">
  <div style="width: 100%; display: flex; justify-content: flex-start; margin-bottom: 20px;">
    <button class="btn-exit" onclick="location.href='index.html'">← Выйти в игру</button>
  </div>

  <h2 style="text-align: center; margin-bottom: 20px; color: #fff;">Перенос прогресса</h2>

  <!-- Переключатель (ползунок) -->
  <div class="v5-tabs" style="margin-bottom: 20px;">
    <div id="tab-save" class="v5-tab active" onclick="switchTab('save')">💾 Сохранить</div>
    <div id="tab-load" class="v5-tab" onclick="switchTab('load')">📥 Загрузить</div>
  </div>

  <!-- Контент: Сохранение -->
  <div id="content-save" class="transfer-content active">
    <p style="color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 10px;">
      Скопируйте этот код и отправьте его себе в мессенджер (или сохраните в заметки).
    </p>
    <textarea id="export-code" class="transfer-textarea" readonly placeholder="Здесь появится код..."></textarea>
    <button class="menu-btn btn-green" style="justify-content: center;" onclick="generateExportCode()">Сгенерировать код</button>
    <button class="menu-btn" style="background: #3b82f6; box-shadow: 0 5px 0 #1e3a8a; justify-content: center;" onclick="copyExportCode()">Скопировать в буфер</button>
  </div>

  <!-- Контент: Загрузка -->
  <div id="content-load" class="transfer-content">
    <p style="color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 10px;">
      Вставьте код, который вы сохранили на другом устройстве, и нажмите «Загрузить».
    </p>
    <textarea id="import-code" class="transfer-textarea" placeholder="Вставьте сюда код..."></textarea>
    <button class="menu-btn btn-green" style="justify-content: center;" onclick="importCode()">Загрузить прогресс</button>
  </div>

</div>

<script>
  // Переключение вкладок
  function switchTab(tab) {
    document.getElementById('tab-save').classList.remove('active');
    document.getElementById('tab-load').classList.remove('active');
    document.getElementById('content-save').classList.remove('active');
    document.getElementById('content-load').classList.remove('active');

    if (tab === 'save') {
      document.getElementById('tab-save').classList.add('active');
      document.getElementById('content-save').classList.add('active');
    } else {
      document.getElementById('tab-load').classList.add('active');
      document.getElementById('content-load').classList.add('active');
    }
  }

  // Генерация кода для текущего активного профиля
  function generateExportCode() {
    const dbStr = localStorage.getItem('eng_db');
    if (!dbStr) {
      alert("База данных пуста. Сначала создайте профиль в игре!");
      return;
    }

    const db = JSON.parse(dbStr);
    if (!db.lastActive || !db.profiles[db.lastActive]) {
      alert("Нет активного профиля. Зайдите в игру и выберите игрока.");
      return;
    }

    const activeName = db.lastActive;
    const profileData = db.profiles[activeName];

    // Упаковываем имя и данные
    const exportObj = { name: activeName, data: profileData };
    
    // Кодируем в Base64 (безопасно для кириллицы)
    const jsonStr = JSON.stringify(exportObj);
    const base64Code = btoa(unescape(encodeURIComponent(jsonStr)));

    document.getElementById('export-code').value = base64Code;
  }

  // Копирование в буфер обмена
  function copyExportCode() {
    const textarea = document.getElementById('export-code');
    if (!textarea.value) {
      alert("Сначала нажмите «Сгенерировать код»!");
      return;
    }
    
    textarea.select();
    textarea.setSelectionRange(0, 99999); // Для мобильных
    navigator.clipboard.writeText(textarea.value).then(() => {
      alert("✅ Код успешно скопирован в буфер обмена!");
    }).catch(() => {
      alert("Не удалось скопировать автоматически. Выделите текст и скопируйте вручную (Ctrl+C).");
    });
  }

  // Загрузка прогресса с проверкой
  function importCode() {
    const code = document.getElementById('import-code').value.trim();
    if (!code) {
      alert("Вставьте код в поле!");
      return;
    }

    try {
      // Декодируем
      const jsonStr = decodeURIComponent(escape(atob(code)));
      const importObj = JSON.parse(jsonStr);

      const importName = importObj.name;
      const importData = importObj.data;

      if (!importName || !importData) throw new Error("Неверный формат");

      let db = JSON.parse(localStorage.getItem('eng_db')) || { profiles: {}, lastActive: null };

      // Проверка: существует ли уже такой профиль
      if (db.profiles[importName]) {
        // Профиль есть, проверяем ПИН-коды
        if (db.profiles[importName].pin !== importData.pin) {
          alert("❌ Ошибка! Профиль с таким именем уже существует, но ПИН-коды не совпадают. Импорт отменен для безопасности.");
          return;
        }

        // ПИН-коды совпадают, спрашиваем подтверждение
        if (!confirm(`Профиль "${importName}" уже существует на этом устройстве.\n\nПерезаписать его прогресс данными из кода?`)) {
          return;
        }

        // Дополнительная защита: просим ввести ПИН
        const enteredPin = prompt(`Введите ПИН-код профиля "${importName}" для подтверждения:`);
        if (enteredPin !== importData.pin) {
          alert("❌ Неверный ПИН-код! Перезапись отменена.");
          return;
        }

      } else {
        // Профиля нет, проверяем лимит
        if (Object.keys(db.profiles).length >= 4) {
          alert(`На устройстве уже 4 профиля. Удалите один, чтобы добавить "${importName}".`);
          return;
        }
      }

      // Сохраняем
      db.profiles[importName] = importData;
      db.lastActive = importName;
      localStorage.setItem('eng_db', JSON.stringify(db));
      
      document.getElementById('import-code').value = '';
      alert(`✅ Прогресс игрока "${importName}" успешно загружен! Обновите страницу игры.`);
      
    } catch (e) {
      alert("❌ Ошибка! Код поврежден или вставлен не полностью. Убедитесь, что скопировали его целиком.");
      console.error(e);
    }
  }
</script>
</body>
</html>
